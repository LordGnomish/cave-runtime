groups:
  - name: cave-search.rules
    rules:
      - alert: CaveSearchDown
        expr: up{job="cave-search"} == 0
        for: 2m
        labels: { severity: critical, module: cave-search }
        annotations: { summary: "cave-search instance down" }
      - alert: CaveSearchClusterRed
        expr: cave_search_cluster_health == 0
        for: 5m
        labels: { severity: critical, module: cave-search }
        annotations: { summary: "Cluster health is RED" }
      - alert: CaveSearchClusterYellow
        expr: cave_search_cluster_health == 1
        for: 30m
        labels: { severity: warning, module: cave-search }
        annotations: { summary: "Cluster health YELLOW for > 30 min" }
      - alert: CaveSearchSearchP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(cave_search_search_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severity: warning, module: cave-search }
        annotations: { summary: "Search p99 > 1s" }
      - alert: CaveSearchHeapHigh
        expr: cave_search_heap_used_bytes / cave_search_heap_max_bytes > 0.85
        for: 10m
        labels: { severity: warning, module: cave-search }
        annotations: { summary: "Heap > 85%" }
      - alert: CaveSearchGCTimeHigh
        expr: rate(cave_search_gc_seconds_total[5m]) > 0.1
        for: 10m
        labels: { severity: warning, module: cave-search }
        annotations: { summary: "GC time > 10% wall clock" }
      - alert: CaveSearchSearchErrors
        expr: rate(cave_search_search_errors_total[5m]) / rate(cave_search_search_total[5m]) > 0.05
        for: 5m
        labels: { severity: warning, module: cave-search }
        annotations: { summary: "Search error ratio > 5%" }
      - alert: CaveSearchRefreshSlow
        expr: histogram_quantile(0.99, sum by (le) (rate(cave_search_refresh_duration_seconds_bucket[5m]))) > 5
        for: 10m
        labels: { severity: info, module: cave-search }
        annotations: { summary: "Refresh p99 > 5s" }
