groups:
  - name: cave-blob.rules
    rules:
      - alert: CaveBlobDown
        expr: up{job="cave-blob"} == 0
        for: 2m
        labels: { severity: critical, module: cave-blob }
        annotations: { summary: "cave-blob instance down" }
      - alert: CaveBlobLatencyP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(cave_blob_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severity: warning, module: cave-blob }
        annotations: { summary: "Request p99 > 1s" }
      - alert: CaveBlobErrorRateHigh
        expr: rate(cave_blob_errors_total[5m]) / rate(cave_blob_requests_total[5m]) > 0.05
        for: 5m
        labels: { severity: warning, module: cave-blob }
        annotations: { summary: "Error ratio > 5%" }
      - alert: CaveBlobReplicationLag
        expr: cave_blob_replication_lag_seconds > 300
        for: 10m
        labels: { severity: warning, module: cave-blob }
        annotations: { summary: "Replication lag > 5min" }
      - alert: CaveBlobMultipartStuck
        expr: cave_blob_multipart_inflight > 50
        for: 30m
        labels: { severity: info, module: cave-blob }
        annotations: { summary: "Multiparts in flight > 50 for > 30 min" }
      - alert: CaveBlobKmsErrorsHigh
        expr: rate(cave_blob_kms_errors_total[5m]) > 0.1
        for: 5m
        labels: { severity: warning, module: cave-blob }
        annotations: { summary: "KMS errors > 0.1/s" }
      - alert: CaveBlobDiskAlmostFull
        expr: cave_blob_disk_used_bytes / cave_blob_disk_total_bytes > 0.9
        for: 5m
        labels: { severity: warning, module: cave-blob }
        annotations: { summary: "Disk > 90% full" }
      - alert: CaveBlobErasureDegraded
        expr: cave_blob_erasure_degraded > 0
        for: 5m
        labels: { severity: warning, module: cave-blob }
        annotations: { summary: "Erasure-coded set in degraded mode" }
