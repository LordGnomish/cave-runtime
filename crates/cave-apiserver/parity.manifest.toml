# parity.manifest.toml — cave-apiserver
# Upstream: kubernetes/kubernetes v1.30.0  https://github.com/kubernetes/kubernetes

[upstream]
org     = "kubernetes"
repo    = "kubernetes"
version = "v1.30.0"

[module]
name        = "cave-apiserver"
description = "Kubernetes API server reimplementation — 26 resource types, full CRUD + watch + status/scale subresources"
source_root = "src"

