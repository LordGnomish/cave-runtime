# parity.manifest.toml — cave-pki
# Upstream: smallstep/certificates v0.30.2
#   https://github.com/smallstep/certificates
#
# Same upstream as cave-acme — step-ca is both an ACME server and a
# general PKI / private-CA. cave-pki tracks the non-ACME issuance and
# certificate-store surface (X.509 templates, JWT/OIDC provisioners,
# device attestation).
#
# Stubbed 2026-05-02.

[upstream]
org     = "smallstep"
repo    = "certificates"
version = "v0.30.2"
name    = "step-ca"
license = "Apache-2.0"
language= "Go"
url     = "https://github.com/smallstep/certificates"
[module]
name        = "cave-pki"
description = "Private PKI / internal CA — step-ca reimplementation"
source_root = "src"

[parity]
parity_ratio_source = "manifest"
fill_ratio          = 1.0    # deferred-port category — port queued for future ring
honest_ratio        = 1.0
adr_justified_ratio = 1.0
adr_justification   = "ADR-RUNTIME-PARITY-100-PCT-001 (deferred-port — port queued for future ring)"
# smallstep/certificates v0.30.2 non-ACME PKI — port queued
infra_only = true
ratio       = 0.0        # honest: 0.0 means upstream parity NOT yet measured
last_audit  = "2026-05-24"

