[[skipped]]
upstream = "pkg/scheduler/extender.go"
reason   = "out-of-scope"
note     = "External scheduler extender (HTTP webhook); not exposed."

[[skipped]]
upstream = "pkg/scheduler/profile/"
reason   = "out-of-scope"
note     = "Multi-profile scheduler (different plugin configs per profile); cave runs a single profile."

[[skipped]]
upstream = "cmd/kube-scheduler/"
reason   = "cli"
note     = "Entry-point binary; cave-scheduler is a library inside cave-runtime."

[[skipped]]
upstream = "pkg/scheduler/apis/config/v1/"
reason   = "backcompat"
note     = "v1 KubeSchedulerConfiguration types; cave uses native Rust config."

[[skipped]]
upstream = "pkg/scheduler/apis/config/v1beta3/"
reason   = "backcompat"
note     = "Old v1beta3 configuration."

[[skipped]]
upstream = "pkg/scheduler/util/"
reason   = "internal"
note     = "Slice/string helpers."

[[skipped]]
upstream = "pkg/scheduler/metrics/"
reason   = "internal"
note     = "Prometheus metrics; cave-metrics owns the metrics surface."

[[skipped]]
upstream = "pkg/scheduler/eventhandlers.go"
reason   = "out-of-scope"
note     = "Watches over node/pod/PVC events to trigger scheduling; cave-scheduler is invoked synchronously by cave-controller-manager."

[[skipped]]
upstream = "pkg/scheduler/testing/"
reason   = "test-helper"
note     = "Test fixtures for upstream tests; ported tests live alongside Rust impls."

