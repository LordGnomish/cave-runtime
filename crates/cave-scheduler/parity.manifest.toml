# parity.manifest.toml — cave-scheduler
# Upstream: kubernetes/kubernetes  https://github.com/kubernetes/kubernetes
#
# Cave-scheduler is a SIMPLIFIED scheduler — Filter → Score → Bind on the
# axes of resource availability, node selectors, taints/tolerations,
# affinity. Full upstream pulls in volume binding, plugin framework, queue,
# extender — those are explicitly enumerated in [[skipped]] below.

[upstream]
org     = "kubernetes"
repo    = "kubernetes"
version = "v1.30.0"

[module]
name        = "cave-scheduler"
description = "Pod scheduler — narrow kube-scheduler replacement (filter+score+bind on resources/selectors/taints/affinity)"
source_root = "src"

[[files]]
upstream = "pkg/scheduler/scheduler.go"
local    = "src/scheduler.rs"

[[files]]
upstream = "pkg/scheduler/framework/types.go"
local    = "src/models.rs"

[[files]]
upstream = "pkg/scheduler/framework/plugins/noderesources/fit.go"
local    = "src/scheduler.rs"

[[files]]
upstream = "pkg/scheduler/framework/plugins/nodeaffinity/node_affinity.go"
local    = "src/scheduler.rs"

[[files]]
upstream = "pkg/scheduler/framework/plugins/tainttoleration/taint_toleration.go"
local    = "src/scheduler.rs"

[[files]]
upstream = "pkg/scheduler/apis/config/types.go"
local    = "src/models.rs"

[[files]]
upstream = "cmd/kube-scheduler/app/server.go"
local    = "src/routes.rs"

# ── Function mappings ────────────────────────────────────────────────────────

[[functions]]
upstream_name = "Scheduler.scheduleOne"
local_name    = "schedule"
file          = "src/scheduler.rs"

[[functions]]
upstream_name = "Scheduler.findNodesThatFit"
local_name    = "schedule"
file          = "src/scheduler.rs"

[[functions]]
upstream_name = "Scheduler.prioritizeNodes"
local_name    = "schedule"
file          = "src/scheduler.rs"

[[functions]]
upstream_name = "ResourceCapacity.HasRoom"
local_name    = "has_room"
file          = "src/models.rs"

[[functions]]
upstream_name = "ResourceCapacity.Subtract"
local_name    = "subtract"
file          = "src/models.rs"

[[functions]]
upstream_name = "ResourceCapacity.Add"
local_name    = "add"
file          = "src/models.rs"

[[functions]]
upstream_name = "Server.Nodes"
local_name    = "list_nodes"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.RegisterNode"
local_name    = "register_node"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.GetNode"
local_name    = "get_node"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.UnregisterNode"
local_name    = "unregister_node"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.CordonNode"
local_name    = "cordon_node"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.UncordonNode"
local_name    = "uncordon_node"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.SchedulePod"
local_name    = "schedule_pod"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.Healthz"
local_name    = "health"
file          = "src/routes.rs"

# ── Test mappings ──────────────────────────────────────────────────────────

[[tests]]
upstream_test = "TestScheduleBasic"
local_test    = "test_schedule_basic"

[[tests]]
upstream_test = "TestScheduleNoCapacity"
local_test    = "test_schedule_no_capacity"

[[tests]]
upstream_test = "TestScheduleNodeSelector"
local_test    = "test_schedule_node_selector"

[[tests]]
upstream_test = "TestScheduleTaintNoToleration"
local_test    = "test_schedule_taint_no_toleration"

[[tests]]
upstream_test = "TestScheduleAffinityBonus"
local_test    = "test_schedule_affinity_bonus"

[[tests]]
upstream_test = "TestResourceCapacityHasRoom"
local_test    = "test_resource_capacity_has_room"

[[tests]]
upstream_test = "TestResourceCapacityNoRoom"
local_test    = "test_resource_capacity_no_room"

[[tests]]
upstream_test = "TestSubtractAndAdd"
local_test    = "test_subtract_and_add"

# ── Surface mappings (HTTP) ────────────────────────────────────────────────

[[surfaces]]
kind          = "http"
upstream_path = "Server.Healthz"
local_path    = "/api/scheduler/health"

[[surfaces]]
kind          = "http"
upstream_path = "Server.Nodes"
local_path    = "/api/scheduler/nodes"

[[surfaces]]
kind          = "http"
upstream_path = "Server.GetNode"
local_path    = "/api/scheduler/nodes/{name}"

[[surfaces]]
kind          = "http"
upstream_path = "Server.CordonNode"
local_path    = "/api/scheduler/nodes/{name}/cordon"

[[surfaces]]
kind          = "http"
upstream_path = "Server.UncordonNode"
local_path    = "/api/scheduler/nodes/{name}/uncordon"

[[surfaces]]
kind          = "http"
upstream_path = "Server.SchedulePod"
local_path    = "/api/scheduler/schedule"

# ── Skipped upstream surface (explicitly out-of-scope) ──────────────────────

[[skipped]]
upstream = "pkg/scheduler/framework/"
reason   = "out-of-scope"
note     = "Plugin framework with PreFilter/Filter/PostFilter/PreScore/Score/Reserve/Permit/PreBind/Bind/PostBind hooks; cave-scheduler runs a fixed pipeline."

[[skipped]]
upstream = "pkg/scheduler/framework/plugins/volumebinding/"
reason   = "out-of-scope"
note     = "Volume binding (PVCs, dynamic provisioning); cave-scheduler does not bind volumes."

[[skipped]]
upstream = "pkg/scheduler/framework/plugins/interpodaffinity/"
reason   = "out-of-scope"
note     = "Inter-pod affinity/anti-affinity; cave-scheduler only does node-affinity."

[[skipped]]
upstream = "pkg/scheduler/framework/plugins/podtopologyspread/"
reason   = "out-of-scope"
note     = "Topology spread constraints; planned."

[[skipped]]
upstream = "pkg/scheduler/framework/plugins/imagelocality/"
reason   = "out-of-scope"
note     = "Score boost for nodes that already have the image; planned."

[[skipped]]
upstream = "pkg/scheduler/framework/plugins/queuesort/"
reason   = "out-of-scope"
note     = "Pluggable queue sort; cave-scheduler runs FIFO."

[[skipped]]
upstream = "pkg/scheduler/framework/plugins/defaultpreemption/"
reason   = "out-of-scope"
note     = "Preemption (evicting lower-priority pods to make room); not implemented."

[[skipped]]
upstream = "pkg/scheduler/internal/queue/"
reason   = "out-of-scope"
note     = "PriorityQueue with active/backoff/unschedulable subqueues; cave does single-pass scheduling."

[[skipped]]
upstream = "pkg/scheduler/internal/cache/"
reason   = "out-of-scope"
