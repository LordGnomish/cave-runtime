# parity.manifest.toml — cave-scheduler
# Upstream: kubernetes/kubernetes v1.30.0  https://github.com/kubernetes/kubernetes
#
# Cave-scheduler reimplements kube-scheduler's filter/score/bind pipeline.
# Mappings below correspond to upstream `pkg/scheduler/` files and the framework
# plugin surface that backs `kube-scheduler`'s scheduling extension points.

[upstream]
org     = "kubernetes"
repo    = "kubernetes"
version = "v1.30.0"

[module]
name        = "cave-scheduler"
description = "kube-scheduler reimplementation — filter / score / bind pipeline with selector, taint, affinity plugins"
source_root = "src"

# ── File mappings ────────────────────────────────────────────────────────────

[[files]]
upstream = "pkg/scheduler/scheduler.go"
local    = "src/scheduler.rs"

[[files]]
upstream = "pkg/scheduler/schedule_one.go"
local    = "src/scheduler.rs"

[[files]]
upstream = "pkg/scheduler/framework/types.go"
local    = "src/models.rs"

[[files]]
upstream = "pkg/scheduler/framework/plugins/noderesources/fit.go"
local    = "src/scheduler.rs"

[[files]]
upstream = "pkg/scheduler/framework/plugins/nodeaffinity/node_affinity.go"
local    = "src/scheduler.rs"

[[files]]
upstream = "pkg/scheduler/framework/plugins/tainttoleration/taint_toleration.go"
local    = "src/scheduler.rs"

[[files]]
upstream = "pkg/scheduler/framework/plugins/selectorspread/selector_spread.go"
local    = "src/scheduler.rs"

# ── Function mappings ────────────────────────────────────────────────────────

[[functions]]
upstream_name = "scheduleOne"
local_name    = "schedule"
file          = "src/scheduler.rs"

[[functions]]
upstream_name = "Filter"
local_name    = "schedule"
file          = "src/scheduler.rs"

[[functions]]
upstream_name = "Score"
local_name    = "schedule"
file          = "src/scheduler.rs"

[[functions]]
upstream_name = "Bind"
local_name    = "schedule"
file          = "src/scheduler.rs"

[[functions]]
upstream_name = "AddNode"
local_name    = "register_node"
file          = "src/routes.rs"

[[functions]]
upstream_name = "RemoveNode"
local_name    = "unregister_node"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Cordon"
local_name    = "cordon_node"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Uncordon"
local_name    = "uncordon_node"
file          = "src/routes.rs"

# ── Test mappings ────────────────────────────────────────────────────────────

[[tests]]
upstream_test = "TestSchedulerScheduleOne"
local_test    = "test_scheduler_schedule_one"

[[tests]]
upstream_test = "TestSchedulerNodeResourcesFit"
local_test    = "test_scheduler_node_resources_fit"

[[tests]]
upstream_test = "TestSchedulerNodeAffinity"
local_test    = "test_scheduler_node_affinity"

[[tests]]
upstream_test = "TestSchedulerTaintToleration"
local_test    = "test_scheduler_taint_toleration"

[[tests]]
upstream_test = "TestSchedulerScoreLeastAllocated"
local_test    = "test_scheduler_score_least_allocated"

[[tests]]
upstream_test = "TestSchedulerBindUpdatesAllocation"
local_test    = "test_scheduler_bind_updates_allocation"

[[tests]]
upstream_test = "TestSchedulerCordonExcludesNode"
local_test    = "test_scheduler_cordon_excludes_node"

[[tests]]
upstream_test = "TestSchedulerNoFeasibleNodes"
local_test    = "test_scheduler_no_feasible_nodes"

# ── Surface mappings (HTTP) ──────────────────────────────────────────────────

[[surfaces]]
kind          = "http"
upstream_path = "GET /healthz"
local_path    = "/api/scheduler/health"

[[surfaces]]
kind          = "http"
upstream_path = "GET /nodes"
local_path    = "/api/scheduler/nodes"

[[surfaces]]
kind          = "http"
upstream_path = "POST /nodes"
local_path    = "/api/scheduler/nodes"

[[surfaces]]
kind          = "http"
upstream_path = "GET /nodes/{name}"
local_path    = "/api/scheduler/nodes/{name}"

[[surfaces]]
kind          = "http"
upstream_path = "DELETE /nodes/{name}"
local_path    = "/api/scheduler/nodes/{name}"

[[surfaces]]
kind          = "http"
upstream_path = "POST /nodes/{name}/cordon"
local_path    = "/api/scheduler/nodes/{name}/cordon"

[[surfaces]]
kind          = "http"
upstream_path = "POST /nodes/{name}/uncordon"
local_path    = "/api/scheduler/nodes/{name}/uncordon"

[[surfaces]]
kind          = "http"
upstream_path = "POST /schedule"
local_path    = "/api/scheduler/schedule"
