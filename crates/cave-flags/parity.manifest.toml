# parity.manifest.toml — cave-flags
# Upstream: Unleash  https://github.com/Unleash/unleash
# Generated by docs/parity/wave3-fill.py — local-surface bookkeeping pass.

[upstream]
org     = "Unleash"
repo    = "unleash"
version = "main"

[module]
name        = "cave-flags"
description = "Feature flag service \u2014 compatible with Unleash. Evaluation engine, REST API, SSE streaming."
source_root = "src"

# ── File mappings ────────────────────────────────────────────────────────────
[[files]]
upstream = "internal/engine.go"
local    = "src/engine.rs"

[[files]]
upstream = "internal/lib.go"
local    = "src/lib.rs"

[[files]]
upstream = "internal/models.go"
local    = "src/models.rs"

[[files]]
upstream = "internal/pool.go"
local    = "src/pool.rs"

[[files]]
upstream = "internal/routes.go"
local    = "src/routes.rs"

[[files]]
upstream = "internal/store.go"
local    = "src/store.rs"

[[files]]
upstream = "internal/unleash.go"
local    = "src/unleash.rs"

