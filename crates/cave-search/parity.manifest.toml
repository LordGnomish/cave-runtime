[upstream]
name = "opensearch-project/OpenSearch"
url = "https://github.com/opensearch-project/OpenSearch"
local_clone = "/tmp/cave-parity-upstream/opensearch/"
language = "Java"
notes = """
REST endpoints enumerated from rest-api-spec/src/main/resources/rest-api-spec/api/*.json (167 files).
Query DSL enumerated from server/src/main/java/org/opensearch/index/query/*QueryBuilder.java.
Aggregations enumerated from server/src/main/java/org/opensearch/search/aggregations/**/*AggregationBuilder.java.
Mapping types enumerated from server/src/main/java/org/opensearch/index/mapper/**/*FieldMapper.java.
"""

[module]
name = "cave-search"
crate_path = "crates/cave-search"
src_root = "crates/cave-search/src"
loc_approx = 1950
files = ["dsl.rs", "index.rs", "aggregation.rs", "mapping.rs", "cluster.rs", "server.rs", "lib.rs", "error.rs"]

[summary]
scope = """
cave-search is a wire-compatible OpenSearch surrogate for embedded/test use:
JSON Query DSL evaluator, in-memory inverted index, basic mappings, a small
aggregation set, single-node cluster state, and an axum HTTP server that mirrors
a small core of the OpenSearch REST API. It is not a Lucene reimplementation —
no segment storage, no sharding, no replication, no persistence, no distributed
coordination, no scripting, no security/RBAC, no plugin SPI.
"""
goal = """
Cover the highest-leverage surface for opensearch-py / opensearch-js clients
running ad-hoc smoke tests against an embedded server: index lifecycle,
indexing/get/delete, _bulk, _search with bool/term/range/match queries, a
handful of metric/bucket aggregations, _cluster/health, _cat/indices.
"""
non_goals = [
  "Lucene segment storage / merge / refresh semantics",
  "sharding, replication, peer recovery, segment-replication",
  "snapshot/restore (S3, FS, GCS, Azure repositories)",
  "ingest pipelines, scripting (Painless), templates",
  "security plugin, RBAC, TLS, audit logging",
  "ML / k-NN / neural-search / anomaly-detection plugins",
  "cross-cluster search/replication, remote stores",
  "data streams, ILM, rollover policies",
  "geo queries beyond geo_point field acceptance",
  "Lucene scoring (BM25), highlighting, suggesters, reranking",
]

