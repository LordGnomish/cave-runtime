reason        = "deferred"
note          = "tool_calls + tool role in chat messages — deferred"

[[skipped]]
upstream_pkg = "KV cache eviction"
reason        = "deferred"
note          = "Daemon-side ergonomic, not in API surface"

[[skipped]]
upstream_pkg = "JSON mode validation"
reason        = "deferred"
note          = "options.format='json' honoured by Ollama; cave does not add cave-side validation"

[[skipped]]
upstream_pkg = "Embedding recall RAG"
reason        = "delegated"
note          = "Owned by cave-hermes"

# ── Partially mapped ──────────────────────────────────────────────────────────

[[partial]]
upstream_pkg = "Daemon lifecycle"
local_files   = ["src/daemon.rs", "src/ollama.rs"]
note          = "Ollama lifecycle subset (show/copy/delete/embed/ps) mapped via OllamaExtrasClient; daemon loop with signal handling partially complete"

[[partial]]
upstream_pkg = "Prompt templates"
local_files   = ["src/draft.rs"]
note          = "Go-template subset ({{ var }}, {{ if }}, {{ range }}) mapped; full Go template engine deferred"

# ── File-to-module mappings ────────────────────────────────────────────────────

[[files]]
