[package]
name = "cave-trufflehog"
description = "Secret scanner — TruffleHog parity: ~700 provider detectors (regex+entropy+live verify), git/github/gitlab/bitbucket/s3/gcs/filesystem/docker/db/stdin sources, chunker, dedup, decoders (base64/utf16/escaped-unicode/html), custom YAML detectors with HTTP verification + successRanges/rotatedRanges, JSON/JSONL/GitHub-Actions/plain reporters, resume checkpoints"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cave-core = { path = "../cave-core" }
cave-auth = { path = "../cave-auth" }

# Web
axum = { workspace = true }
tower = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }

# Scanning primitives
regex = { workspace = true }
aho-corasick = { workspace = true }

# Crypto / hashing for dedup + entropy
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# Git source
git2 = { version = "0.19", default-features = false }

# HTTP verify
reqwest = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
