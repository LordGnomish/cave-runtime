# parity.manifest.toml — cave-cloud-controller-manager
# Upstream: kubernetes/kubernetes  staging/src/k8s.io/cloud-provider/
#
# Cave-cloud-controller-manager implements the 3 core cloud controllers
# (Node, Service-LoadBalancer, Route) against an abstract CloudProvider
# trait. Real provider impls (AWS, GCP, Azure) live in sibling crates.

[upstream]
org     = "kubernetes"
repo    = "kubernetes"
version = "v1.30.0"

[module]
name        = "cave-cloud-controller-manager"
description = "Cloud-provider integration — node, service-load-balancer, route reconcile loops with a swappable provider trait"
source_root = "src"

[[files]]
upstream = "staging/src/k8s.io/cloud-provider/cloud.go"
local    = "src/provider.rs"

[[files]]
upstream = "staging/src/k8s.io/cloud-provider/controllers/node/node_controller.go"
local    = "src/controllers.rs"

[[files]]
upstream = "staging/src/k8s.io/cloud-provider/controllers/service/controller.go"
local    = "src/controllers.rs"

[[files]]
upstream = "staging/src/k8s.io/cloud-provider/controllers/route/route_controller.go"
local    = "src/controllers.rs"

[[files]]
upstream = "staging/src/k8s.io/cloud-provider/api/types.go"
local    = "src/models.rs"

[[files]]
upstream = "staging/src/k8s.io/cloud-provider/fake/fake.go"
local    = "src/provider.rs"

[[files]]
upstream = "cmd/cloud-controller-manager/main.go"
local    = "src/lib.rs"

