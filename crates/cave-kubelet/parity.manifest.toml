[[skipped]]
upstream = "pkg/kubelet/cri/"
reason   = "out-of-scope"
note     = "CRI client adapter; cave-kubelet calls cave-cri in-process."

[[skipped]]
upstream = "pkg/kubelet/secret/"
reason   = "out-of-scope"
note     = "Secret manager; cave-kubelet pulls from cave-apiserver on demand."

[[skipped]]
upstream = "pkg/kubelet/configmap/"
