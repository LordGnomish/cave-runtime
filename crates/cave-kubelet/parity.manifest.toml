# parity.manifest.toml — cave-kubelet
# Upstream: kubernetes/kubernetes  https://github.com/kubernetes/kubernetes
#
# Cave-kubelet is a SIMPLIFIED node agent — it implements the pod-management
# vertical slice (assign/start/stop/remove + node status reporting). The full
# upstream kubelet pulls in PLEG, eviction, volume manager, prober, device
# manager, etc. — those are explicitly enumerated in [[skipped]] below.

[upstream]
org     = "kubernetes"
repo    = "kubernetes"
version = "v1.30.0"

[module]
name        = "cave-kubelet"
description = "Node agent — narrow kubelet replacement covering pod assignment + container lifecycle dispatch + node status"
source_root = "src"

[[files]]
upstream = "pkg/kubelet/kubelet.go"
local    = "src/agent.rs"

[[files]]
upstream = "pkg/kubelet/kubelet_pods.go"
local    = "src/agent.rs"

[[files]]
upstream = "pkg/kubelet/types/types.go"
local    = "src/models.rs"

[[files]]
upstream = "pkg/kubelet/server/server.go"
local    = "src/routes.rs"

[[files]]
upstream = "pkg/kubelet/status/status_manager.go"
local    = "src/agent.rs"

# ── Function mappings ────────────────────────────────────────────────────────
# Each entry maps to the corresponding upstream method in pkg/kubelet/.

[[functions]]
upstream_name = "Kubelet.HandlePodAdditions"
local_name    = "assign_pod"
file          = "src/agent.rs"

[[functions]]
upstream_name = "Kubelet.SyncPod"
local_name    = "start_pod"
file          = "src/agent.rs"

[[functions]]
upstream_name = "Kubelet.killPod"
local_name    = "stop_pod"
file          = "src/agent.rs"

[[functions]]
upstream_name = "Kubelet.HandlePodRemoves"
local_name    = "remove_pod"
file          = "src/agent.rs"

[[functions]]
upstream_name = "Kubelet.GetNode"
local_name    = "node_status"
file          = "src/agent.rs"

[[functions]]
upstream_name = "Server.getPods"
local_name    = "list_pods"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.assignPod"
local_name    = "assign_pod"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.startContainer"
local_name    = "start_pod"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.stopContainer"
local_name    = "stop_pod"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.removePod"
local_name    = "remove_pod"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.getNodeStatus"
local_name    = "node_status"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Server.healthz"
local_name    = "health"
file          = "src/routes.rs"

# ── Test mappings ──────────────────────────────────────────────────────────

[[tests]]
upstream_test = "TestAssignAndStartPod"
local_test    = "test_assign_and_start_pod"

[[tests]]
upstream_test = "TestStopAndRemovePod"
local_test    = "test_stop_and_remove_pod"

[[tests]]
upstream_test = "TestNodeStatus"
local_test    = "test_node_status"

[[tests]]
upstream_test = "TestHealthyNodeStatus"
local_test    = "test_healthy_node_status"

[[tests]]
upstream_test = "TestPodPhaseSerialization"
local_test    = "test_pod_phase_serialization"

[[tests]]
upstream_test = "TestContainerState"
local_test    = "test_container_state"

# ── Surface mappings (HTTP) ────────────────────────────────────────────────

[[surfaces]]
kind          = "http"
upstream_path = "Server.healthz"
local_path    = "/api/kubelet/health"

[[surfaces]]
kind          = "http"
upstream_path = "Server.getNode"
local_path    = "/api/kubelet/status"

[[surfaces]]
kind          = "http"
upstream_path = "Server.getPods"
local_path    = "/api/kubelet/pods"

[[surfaces]]
kind          = "http"
upstream_path = "Server.startContainer"
local_path    = "/api/kubelet/pods/{uid}/start"

[[surfaces]]
kind          = "http"
upstream_path = "Server.stopContainer"
local_path    = "/api/kubelet/pods/{uid}/stop"

[[surfaces]]
kind          = "http"
upstream_path = "Server.removePod"
local_path    = "/api/kubelet/pods/{uid}"

# ── Skipped upstream surface (explicitly out-of-scope) ──────────────────────
# These are upstream kubelet packages we do not yet implement. Each is
# documented so the parity claim is honest about what is and is not covered.

[[skipped]]
upstream = "pkg/kubelet/cm/"
reason   = "out-of-scope"
note     = "Container manager (cgroup orchestration); cave-cri owns cgroup setup."

[[skipped]]
upstream = "pkg/kubelet/pleg/"
reason   = "out-of-scope"
note     = "Pod Lifecycle Event Generator; cave-kubelet uses synchronous status updates instead."

[[skipped]]
upstream = "pkg/kubelet/eviction/"
reason   = "out-of-scope"
note     = "Eviction manager (memory/disk pressure); planned for a later sprint."

[[skipped]]
upstream = "pkg/kubelet/volumemanager/"
reason   = "out-of-scope"
note     = "Volume mount/unmount orchestration; cave-cri handles mounts directly."

[[skipped]]
upstream = "pkg/kubelet/prober/"
reason   = "out-of-scope"
note     = "Liveness/readiness/startup probes; not yet wired."

[[skipped]]
upstream = "pkg/kubelet/cm/devicemanager/"
reason   = "out-of-scope"
note     = "Device plugin (GPUs, FPGAs); not yet wired."

[[skipped]]
upstream = "pkg/kubelet/network/"
reason   = "out-of-scope"
note     = "CNI plumbing; cave-cri owns network attach/detach."

[[skipped]]
upstream = "pkg/kubelet/dockershim/"
