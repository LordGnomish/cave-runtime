# parity.manifest.toml — cave-kubelet
# Upstream: kubernetes/kubernetes v1.30.0  https://github.com/kubernetes/kubernetes
#
# Cave-kubelet is the node-agent reimplementation. The mappings below correspond
# to upstream `pkg/kubelet/` files and the `/pods`, `/healthz`, `/stats/summary`
# HTTP surface served by the kubelet itself.

[upstream]
org     = "kubernetes"
repo    = "kubernetes"
version = "v1.30.0"

[module]
name        = "cave-kubelet"
description = "Kubelet node-agent reimplementation — pod admission, container lifecycle, node status reporting"
source_root = "src"

# ── File mappings ────────────────────────────────────────────────────────────

[[files]]
upstream = "pkg/kubelet/kubelet.go"
local    = "src/agent.rs"

[[files]]
upstream = "pkg/kubelet/pod_workers.go"
local    = "src/agent.rs"

[[files]]
upstream = "pkg/kubelet/types/pod_status.go"
local    = "src/models.rs"

[[files]]
upstream = "pkg/kubelet/server/server.go"
local    = "src/routes.rs"

[[files]]
upstream = "pkg/kubelet/status/status_manager.go"
local    = "src/agent.rs"

# ── Function mappings ────────────────────────────────────────────────────────

[[functions]]
upstream_name = "HandlePodAdditions"
local_name    = "assign_pod"
file          = "src/agent.rs"

[[functions]]
upstream_name = "syncPod"
local_name    = "start_pod"
file          = "src/agent.rs"

[[functions]]
upstream_name = "killPod"
local_name    = "stop_pod"
file          = "src/agent.rs"

[[functions]]
upstream_name = "HandlePodRemoves"
local_name    = "remove_pod"
file          = "src/agent.rs"

[[functions]]
upstream_name = "updateRuntimeUp"
local_name    = "node_status"
file          = "src/agent.rs"

[[functions]]
upstream_name = "ListPodsFromDisk"
local_name    = "list_pods"
file          = "src/routes.rs"

[[functions]]
upstream_name = "Healthz"
local_name    = "health"
file          = "src/routes.rs"

# ── Test mappings ────────────────────────────────────────────────────────────

[[tests]]
upstream_test = "TestKubeletPodAdmit"
local_test    = "test_kubelet_pod_admit"

[[tests]]
upstream_test = "TestKubeletSyncPod"
local_test    = "test_kubelet_sync_pod"

[[tests]]
upstream_test = "TestKubeletKillPod"
local_test    = "test_kubelet_kill_pod"

[[tests]]
upstream_test = "TestKubeletNodeStatus"
local_test    = "test_kubelet_node_status"

[[tests]]
upstream_test = "TestKubeletRemovePod"
local_test    = "test_kubelet_remove_pod"

[[tests]]
upstream_test = "TestKubeletPodPhase"
local_test    = "test_kubelet_pod_phase"

[[tests]]
upstream_test = "TestKubeletContainerState"
local_test    = "test_kubelet_container_state"

[[tests]]
upstream_test = "TestKubeletListPods"
local_test    = "test_kubelet_list_pods"

# ── Surface mappings (HTTP) ──────────────────────────────────────────────────

[[surfaces]]
kind          = "http"
upstream_path = "GET /healthz"
local_path    = "/api/kubelet/health"

[[surfaces]]
kind          = "http"
upstream_path = "GET /pods"
local_path    = "/api/kubelet/pods"

[[surfaces]]
kind          = "http"
upstream_path = "GET /stats/summary"
local_path    = "/api/kubelet/status"

[[surfaces]]
kind          = "http"
upstream_path = "POST /pods"
local_path    = "/api/kubelet/pods"

[[surfaces]]
kind          = "http"
upstream_path = "POST /pods/{uid}/start"
local_path    = "/api/kubelet/pods/{uid}/start"

[[surfaces]]
kind          = "http"
upstream_path = "POST /pods/{uid}/stop"
local_path    = "/api/kubelet/pods/{uid}/stop"

[[surfaces]]
kind          = "http"
upstream_path = "DELETE /pods/{uid}"
local_path    = "/api/kubelet/pods/{uid}"
