[[skipped]]
upstream = "pkg/kubelet/cadvisor/"
reason   = "out-of-scope"
note     = "cAdvisor wrapper for stats; cave-kubelet does not collect node metrics."

[[skipped]]
upstream = "pkg/kubelet/leaky/"
reason   = "internal"
note     = "Internal error helpers."

[[skipped]]
upstream = "pkg/kubelet/server/streaming/"
reason   = "out-of-scope"
