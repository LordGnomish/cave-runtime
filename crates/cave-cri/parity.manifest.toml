# parity.manifest.toml — cave-cri
# Upstream: containerd v1.7.0  https://github.com/containerd/containerd

[upstream]
org     = "containerd"
repo    = "containerd"
version = "v1.7.0"

[module]
name        = "cave-cri"
description = "containerd CRI reimplementation — full RuntimeService + ImageService + SnapshotService coverage"
source_root = "src"

