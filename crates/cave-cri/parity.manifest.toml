# ── Skipped upstream surface (explicitly out-of-scope) ──────────────────────

[[skipped]]
upstream = "cmd/containerd/"
reason   = "cli"
note     = "Daemon binary; cave-cri runs as a library inside cave-runtime."

[[skipped]]
upstream = "cmd/ctr/"
reason   = "cli"
note     = "containerd CLI client; deferred."

[[skipped]]
upstream = "cmd/containerd-shim/"
reason   = "internal"
note     = "Shim process model; Cave uses an in-process runtime."

[[skipped]]
upstream = "cmd/containerd-shim-runc-v2/"
reason   = "internal"
note     = "runc-v2 shim; Cave's runtime executes OCI specs directly."

[[skipped]]
