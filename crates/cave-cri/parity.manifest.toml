reason   = "backcompat"
note     = "v1 runtime API superseded by v2."

[[skipped]]
upstream = "integration/"
reason   = "test-helper"
note     = "containerd integration tests; ported tests live alongside Rust impls."

[[skipped]]
upstream = "services/server/server.go"
reason   = "internal"
note     = "gRPC server bootstrap; Cave uses axum HTTP."

[[skipped]]
upstream = "plugins/transfer/"
reason   = "internal"
note     = "Transfer service for image push/pull; covered by registry.rs."

[[skipped]]
upstream = "vendor/"
reason   = "vendored"
note     = "Go module dependency tree."

[[skipped]]
upstream = "api/types/"
reason   = "internal"
note     = "Protocol-buffer generated types; we regenerate native Rust types."

[[skipped]]
upstream = "docs/"
reason   = "docs"
note     = "Documentation."

[[skipped]]
upstream = "tracing/"
reason   = "internal"
note     = "OpenTelemetry plumbing — Cave uses cave-trace."

[[skipped]]
