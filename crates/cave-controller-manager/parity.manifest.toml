# parity.manifest.toml — cave-controller-manager
# Upstream: kubernetes/kubernetes  https://github.com/kubernetes/kubernetes
#
# Cave-controller-manager implements 5 controllers covering the most-used
# k8s reconcile loops: deployment, replicaset, job, namespace lifecycle,
# endpoint-slice. Upstream kube-controller-manager runs ~30 controllers;
# the rest are explicitly out-of-scope (see [[skipped]]).

[upstream]
org     = "kubernetes"
repo    = "kubernetes"
version = "v1.30.0"

[module]
name        = "cave-controller-manager"
description = "Workload controllers — deployment, replicaset, job, namespace, endpoint-slice reconcile loops"
source_root = "src"

[[files]]
upstream = "pkg/controller/deployment/deployment_controller.go"
local    = "src/controllers.rs"

[[files]]
upstream = "pkg/controller/replicaset/replica_set.go"
local    = "src/controllers.rs"

[[files]]
upstream = "pkg/controller/job/job_controller.go"
local    = "src/controllers.rs"

[[files]]
upstream = "pkg/controller/namespace/namespace_controller.go"
local    = "src/controllers.rs"

[[files]]
upstream = "pkg/controller/endpointslice/endpointslice_controller.go"
local    = "src/controllers.rs"

[[files]]
upstream = "pkg/controller/controller_utils.go"
local    = "src/controllers.rs"

[[files]]
upstream = "staging/src/k8s.io/api/apps/v1/types.go"
local    = "src/models.rs"

[[files]]
upstream = "staging/src/k8s.io/api/batch/v1/types.go"
local    = "src/models.rs"

[[files]]
upstream = "staging/src/k8s.io/api/core/v1/types.go"
local    = "src/models.rs"

[[files]]
upstream = "cmd/kube-controller-manager/app/controllermanager.go"
local    = "src/lib.rs"

