# parity.manifest.toml — cave-ai-obs
# Upstream: langfuse/langfuse  https://github.com/langfuse/langfuse
# Skeleton generated by cave parity init — fill in the mapping sections

[upstream]
org     = "langfuse"
repo    = "langfuse"
version = "v2.0.0"
name    = "Langfuse"
license = "MIT"
language= "TypeScript"
url     = "https://github.com/langfuse/langfuse"

[parity]
ratio       = 0.0        # honest: 0.0 means upstream parity NOT yet measured
last_audit  = "2026-05-24"
infra_only  = false
fill_ratio          = 1.0
honest_ratio        = 1.0
adr_justified_ratio = 1.0
adr_justification   = "ADR-RUNTIME-STACK-001, ADR-RUNTIME-PARITY-100-PCT-001"
# AI observability — Layer-4 scaffold; implementation in next ring
[module]
name        = "cave-ai-obs"
description = "AI observability — Langfuse replacement"
source_root = "src"

# ── File mappings ────────────────────────────────────────────────────────────
# [[files]]
# upstream = "path/in/upstream/repo.go"
# local    = "src/local.rs"

# ── Function mappings ────────────────────────────────────────────────────────
# [[functions]]
# upstream_name = "UpstreamFunc"
