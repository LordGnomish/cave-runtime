# ── Skipped upstream surface (explicitly out-of-scope) ──────────────────────
# Each entry documents *why* a piece of upstream Go is intentionally not ported.
# Categories: cli (etcdctl/etcdutl), internal (raft/wal/storage internals),
# embed (Go-only embedded API), backcompat (v2 legacy), test-helper.

[[skipped]]
upstream = "etcdctl/"
reason   = "cli"
note     = "Command-line client; users run cave-cli/etcdctl-compatible binary."

[[skipped]]
upstream = "etcdutl/"
reason   = "cli"
note     = "Recovery/snapshot CLI; deferred to a separate ops binary."

[[skipped]]
upstream = "raft/"
reason   = "internal"
note     = "Raft consensus engine — Cave runs single-leader plumbing today; clustering parity is its own sprint."

[[skipped]]
upstream = "server/wal/"
reason   = "internal"
note     = "WAL on-disk format is an internal storage detail, not part of the public client surface."

[[skipped]]
upstream = "server/storage/backend/bolt/"
reason   = "internal"
note     = "BoltDB-specific storage backend; Cave uses an in-memory + history index instead."

[[skipped]]
upstream = "client/v3/"
reason   = "embed"
note     = "Go client library for embedding etcd; clients of Cave use HTTP/JSON, not the Go API."

[[skipped]]
upstream = "client/v2/"
reason   = "backcompat"
note     = "Legacy v2 API removed in upstream 3.5+; not implemented."

[[skipped]]
upstream = "tests/integration/"
reason   = "test-helper"
note     = "Upstream test scaffolding; ported tests live alongside their Rust impl."

