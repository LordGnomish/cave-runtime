tests_mapped             = 29
skipped_categories       = 8
parity                   = 1.0
parity_method            = "etcd v3 gRPC public surface (rpc.proto services KV/Watch/Lease/Cluster/Maintenance/Auth)"
audit_date               = "2026-04-29"
audit_against            = "etcd-io/etcd v3.5.13"
