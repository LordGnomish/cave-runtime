[package]
name = "cave-auth"
description = "Full Okta AuthN+AuthZ — OIDC, RBAC, ABAC, SCIM 2.0, PAT, sessions, multi-tenancy"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cave-auth"
readme = "README.md"
rust-version.workspace = true
keywords = ["auth", "oidc", "rbac", "scim", "identity"]
categories = ["authentication", "web-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cave-core = { path = "../cave-core" }
axum = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
# Crypto: SHA-256 for PAT hashing
ring = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
# SAML 2.0 protocol parsing — Keycloak `saml-core` port (src/saml/)
quick-xml = "0.37"
flate2    = "1.0"
# SHA-256 digests for SAML 1.1 DSig (src/wsfed/) and OID4VC DataIntegrityProof
sha2 = { workspace = true }
# Ed25519 for OID4VC eddsa-rdfc-2022 Data Integrity Proof
ed25519-dalek = { workspace = true }
# SMTP outbox for email_listener — `builder` for messages, `smtp-transport` for real send,
# `tokio1-rustls-tls` for async TLS, `stub` exposed via cfg(test) for in-memory tests.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "tokio1-rustls-tls", "tokio1", "tracing"] }
# Templating for email_listener
handlebars = "6"
# Lock primitives for OID4VC issuer state
parking_lot = { workspace = true }

[dev-dependencies]
urlencoding = "2"
