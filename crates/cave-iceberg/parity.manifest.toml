# Parity manifest for cave-iceberg vs apache/iceberg.
# This file enumerates the upstream surface (REST endpoints + Java API)
# and records, for each item, whether the local Rust crate implements it.
# Source-of-truth surfaces consulted:
#   - open-api/rest-catalog-open-api.yaml          (REST endpoints)
#   - api/src/main/java/org/apache/iceberg/        (Table, Catalog, expressions)
#   - format-spec.md / iceberg.apache.org/spec     (manifests, schemas, partitions)

[upstream]
org    = "apache"
repo   = "iceberg"
commit = "c81534fba6a521f70dd1c054c4f688622c04c09d"

[module]
name  = "cave-iceberg"
path  = "crates/cave-iceberg"
loc   = 3900

[summary]
items_total       = 167
mapped            = 51
partial           = 18
unmapped          = 64
skipped_cli       = 1
skipped_ui        = 3
skipped_engine    = 4
skipped_oos_jvm   = 22
skipped_oos_file  = 4
fill              = 0.509
notes             = "Phase-B close. Commit handler now accepts the upstream `CommitTableRequest{requirements[], updates[]}` body alongside the legacy shape (assert-create / assert-current-snapshot-id / assert-ref-snapshot-id requirements; set-snapshot-ref(main) / add-snapshot / set-properties / remove-properties updates honoured). New endpoints: POST /v1/{prefix}/namespaces/{ns}/register, GET /v1/{prefix}/namespaces/{ns}/tables/{t}/credentials (returns empty storage-credentials list — no STS provider wired), POST /v1/{prefix}/namespaces/{ns}/tables/{t}/sign (validates table existence and echoes uri+headers — cave-iceberg is not an SigV4 signer), POST /v1/{prefix}/transactions/commit (multi-table commit, sequential apply on per-table RwLock). File-format readers/writers (Parquet/ORC/Avro/Puffin) reclassified as out-of-scope: those belong inside data-plane query engines (cave-datafusion etc.), not the catalog. JVM-only Catalog/Table API surface (TableBuilder, newAppend/newOverwrite/newRowDelta/etc., Table.io, Table.locationProvider, ManageSnapshots, UpdateSchema/UpdatePartitionSpec/UpdateLocation/UpdateProperties builders) reclassified as out-of-scope: cave-iceberg exposes the REST surface only; JVM-style fluent builders are a Java SDK concern. Items still unmapped: views (full subsystem — listViews/createView/loadView/replaceView/dropView/headView/renameView/registerView), OAuth/auth, plan endpoints (POST /plan, GET /plan/{id}, DELETE /plan/{id}, POST /tasks), HEAD probes (namespaceExists, tableExists, viewExists), metrics endpoint, expressions, sort orders, decimal/fixed primitives, nested types (Struct/List/Map), {prefix} multi-tenant routing, ETag concurrency, pagination, statistics files, on-disk manifest IO."

