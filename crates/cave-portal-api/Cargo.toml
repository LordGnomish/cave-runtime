[package]
name = "cave-portal-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cave Portal HTTP API — attribution, telemetry, dashboard endpoints"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
prometheus-client.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true }

[[bin]]
name = "attribution-server"
path = "src/bin/attribution_server.rs"

[dev-dependencies]
tempfile = "3"
tower = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
